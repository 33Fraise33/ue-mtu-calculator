name: Deploy static calculator

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Create patch releases for main commits
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release.mjs
      - name: Set build version
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          test -n "$RELEASE_VERSION"
          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check this is still the latest main commit
        id: current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$latest" = "$TARGET_SHA" ]; then echo 'deploy=true' >> "$GITHUB_OUTPUT"; else echo 'Skipping stale deployment'; fi
      - id: deployment
        if: steps.current.outputs.deploy == 'true'
        uses: actions/deploy-pages@v5
